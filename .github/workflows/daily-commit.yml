name: Daily Contribution Graph

on:
  schedule:
    # Run automatically every day at 12:00 PM UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Make daily contribution
        run: |
          echo "Automated daily contribution on $(date)" >> .github/daily-contribution-log.txt
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          git add .github/daily-contribution-log.txt
          git commit -m "Automated daily contribution update"
          
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
